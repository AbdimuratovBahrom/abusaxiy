<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Фото электрощитов ШР, ШО, ВРУ, ЯРВ ТЦ Abusaxiy по блоку и ряду"/>
  <meta name="theme-color" content="#1e40af"/>
  <title>Фото щитов — Abusaxiy</title>
  <link rel="shortcut icon" href="./css/images/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="./css/design-system.css"/>
  <link rel="stylesheet" href="./css/style.css"/>
  <link rel="stylesheet" href="./css/shields.css"/>
</head>
<body>
  <header class="ds-header">
    <span class="ds-header-title" id="headerTitle">Abusaxiy</span>
    <div class="ds-header-controls">
      <div class="ds-lang-group" role="group" aria-label="Til / Язык">
        <button type="button" class="ds-lang-btn active" data-lang="ru">RU</button>
        <button type="button" class="ds-lang-btn" data-lang="uz_latn">O'z</button>
        <button type="button" class="ds-lang-btn" data-lang="uz_cyrl">Ўз</button>
      </div>
      <button type="button" class="ds-theme-btn" id="themeToggle" aria-label="Переключить тему">🌙</button>
    </div>
  </header>

  <main class="ds-page shields-page">
    <a href="./index.html" class="shields-back" id="shieldsBackLink">← Назад</a>
    <h1 class="shields-title" id="shieldsTitle">Фото электрощитов</h1>
    <p class="shields-intro" id="shieldsIntroLine">Поиск по блоку и ряду магазина</p>

    <section class="ds-card shields-filters-card">
      <div class="shields-selects">
        <select id="shieldsBlockSelect" class="ds-select" aria-label="Блок"></select>
        <select id="shieldsRowSelect" class="ds-select" aria-label="Ряд"></select>
      </div>
      <div class="shields-chips" id="shieldsTypeChips"></div>
      <p class="shields-total" id="shieldsTotalLine"></p>
    </section>

    <div id="shieldsGrid" class="shields-grid"></div>
  </main>

  <script src="./js/translations.js"></script>
  <script src="./js/shields-data.js"></script>
  <script src="./js/shields.js"></script>
</body>
</html>
